<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>PlacementPrep – AI Placement Preparation Platform</title>

    <meta name="description"
          content="Free AI Placement Preparation Platform for Aptitude Practice, DSA Sheet, Resume Analyzer, Interview Preparation and Job Tracker.">

    <meta name="keywords"
          content="Placement Preparation, Aptitude Practice, DSA Sheet, Resume Analyzer, Interview Preparation, PlacementPrep, AI Placement Prep">

    <meta name="robots" content="index, follow">
    <meta name="author" content="Dhruv Prajapati">

    <!-- Google Structured Data -->
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"Organization",
      "name":"PlacementPrep",
      "url":"https://placementprep-0hcb.onrender.com/",
      "founder":{
        "@type":"Person",
        "name":"Dhruv Prajapati"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- CSS (500 Error Fix) -->
    <link rel="stylesheet" th:href="@{/style.css}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="login-box">

        <h1>🤖 AI Placement Prep</h1>
        <p>Login to continue your placement journey.</p>

        <!-- Success Message -->
        <div th:if="${param.success}" class="success-box">
            <i class="fa-solid fa-circle-check"></i>
            <span>Account Created Successfully! Please Login.</span>
        </div>

        <!-- Error Message -->
        <div th:if="${param.error}" class="error-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Invalid Email or Password.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email"
                       name="email"
                       placeholder="Enter Email"
                       required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                       name="password"
                       placeholder="Enter Password"
                       required>
            </div>

            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                LOGIN
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a th:href="@{/signup}">Signup</a>
        </p>

    </div>

    <!-- Footer -->
    <footer class="footer">
        © 2026 PlacementPrep | Developed by
        <strong>Dhruv Prajapati</strong>
    </footer>

</body>
</html>
