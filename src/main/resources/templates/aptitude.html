<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aptitude Practice</title>

    <link rel="stylesheet" href="/aptitude.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="quiz-container">

    <div class="top-bar">
        <h1><i class="fa-solid fa-brain"></i> Aptitude Practice</h1>
        <a href="/dashboard" class="back-btn">⬅ Dashboard</a>
    </div>

    <!-- IMPORTANT: action + method add kiya -->
    <form action="/submitQuiz" method="post">

        <div class="question-card" th:each="q,stat : ${questions}">

            <h2>
                Q<span th:text="${stat.count}"></span>.
                <span th:text="${q.question}"></span>
            </h2>

            <label class="option">
                <input type="radio" th:name="'q'+${q.id}" value="A" required>
                <span th:text="${q.optionA}"></span>
            </label>

            <label class="option">
                <input type="radio" th:name="'q'+${q.id}" value="B">
                <span th:text="${q.optionB}"></span>
            </label>

            <label class="option">
                <input type="radio" th:name="'q'+${q.id}" value="C">
                <span th:text="${q.optionC}"></span>
            </label>

            <label class="option">
                <input type="radio" th:name="'q'+${q.id}" value="D">
                <span th:text="${q.optionD}"></span>
            </label>

        </div>

        <button class="submit-btn" type="submit">
            <i class="fa-solid fa-paper-plane"></i>
            Submit Quiz
        </button>

    </form>

</div>

</body>
</html>
