<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Recommendation</title>
    <link rel="stylesheet" th:href="@{/job.css}">
</head>

<body>

<div class="container">

    <a href="/dashboard" class="back-btn">⬅ Back to Dashboard</a>

    <h1>💼 Job Recommendation</h1>

    <p class="subtitle">
        Select your technical skills to find matching placement jobs.
    </p>

    <form action="/recommendJobs" method="post">

        <div class="skills-grid">

            <label><input type="checkbox" name="java"> Java</label>

            <label><input type="checkbox" name="spring"> Spring Boot</label>

            <label><input type="checkbox" name="mysql"> SQL / MySQL</label>

            <label><input type="checkbox" name="html"> HTML</label>

            <label><input type="checkbox" name="css"> CSS</label>

            <label><input type="checkbox" name="javascript"> JavaScript</label>

            <label><input type="checkbox" name="react"> React</label>

            <label><input type="checkbox" name="github"> GitHub</label>

            <label><input type="checkbox" name="dsa"> DSA / LeetCode</label>

        </div>

        <button type="submit">🔍 Find Recommended Jobs</button>

    </form>

</div>

</body>
</html>
